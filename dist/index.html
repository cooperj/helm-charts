<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh's Helm Charts</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/media/favicons/32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/media/favicons/16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/media/favicons/180.png">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/media/styles.css">
</head>

<body>
    <div class="box">
        <h1>Josh's Helm Charts</h1>
    </div>
    <div class="box">
        <a href="https://github.com/cooperj/helm-charts" target="_blank" rel="noopener noreferrer" class="action" tabindex="0">Open Repo</a>
        <a href="/index.yaml" class="action" tabindex="0">Open Index</a>
    </div>
    <div class="box">
        
        <strong>
            Getting started couldn't be easier, just run the following commands to start using my charts.
        </strong>
        
    </div>
    <div class="box">
        <div class="command-list" aria-label="Helm repository commands">
            <div class="action command-layer" role="button" tabindex="0" aria-label="Copy command: helm repo add joshc https://charts.joshc.uk"><code>helm repo add joshc https://charts.joshc.uk</code></div>
            <div class="action command-layer" role="button" tabindex="0" aria-label="Copy command: helm repo update"><code>helm repo update</code></div>
            <div class="action command-layer" role="button" tabindex="0" aria-label="Copy command: helm search repo joshc"><code>helm search repo joshc</code></div>
        </div>
    </div>
    <script src="/media/copy.js" defer></script>
</body>

</html>
