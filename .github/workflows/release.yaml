name: Release Charts

on:
  push:
    branches: [main]
    paths: ['charts/**']
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip the already-released version guard'
        type: boolean
        default: false

concurrency:
  group: chart-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Fail if any version already exists
        id: guard
        if: ${{ !inputs.force }}
        run: |
          released=""
          for chart in charts/*/; do
            name=$(basename "$chart")
            version=$(grep '^version:' "$chart/Chart.yaml" | awk '{print $2}')
            if [ -f "dist/releases/${name}-${version}.tgz" ]; then
              echo "::error::${name}-${version} already released — bump the version in Chart.yaml"
              exit 1
            fi
            released="$released ${name}@${version}"
          done
          echo "released=$released" >> "$GITHUB_OUTPUT"

      - name: Lint and package all charts
        run: |
          mkdir -p dist/releases
          for chart in charts/*/; do
            helm lint "$chart"
            helm package "$chart" -d dist/releases
          done

      - name: Rebuild index from repo state (no network fetch)
        run: |
          helm repo index dist/releases --url https://charts.joshc.uk/charts
          mv dist/releases/index.yaml dist/index.yaml

      - name: Capture authorship from triggering commit
        id: author
        run: |
          {
            echo "main=$(git log -1 --pretty=format:'%an <%ae>')"
            echo "trailers<<EOF"
            git log -1 --pretty=%B | grep '^Co-authored-by:' || true
            echo "Co-authored-by: $(git log -1 --pretty=format:'%an <%ae>')"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && exit 0
          git commit --author="${{ steps.author.outputs.main }}" \
            -m "Release:${{ steps.guard.outputs.released }}" \
            -m "${{ steps.author.outputs.trailers }}"
          git push
